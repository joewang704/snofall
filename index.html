<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Indy Pass East Coast Snowfall</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="resorts.js"></script>
    <!-- External packages -->
    <script src="https://cdn.plot.ly/plotly-3.3.1.min.js"></script>
  </head>
  <body>
    <h1>Indy Pass – East Coast Snowfall</h1>
    <div class="muted">Uses NWS forecast snowfall amounts (next 7 days)</div>

    <label>
      Select date:
      <select id="daySelect"></select>
    </label>

    <ul id="resortList"></ul>
    <button id="showGraphBtn">Show 7-Day Graph</button>
    <div
      id="snowfallChart"
      style="max-width: 900px; height: 500px; margin-top: 20px"
    ></div>

    <script src="graph.js"></script>
    <script src="index.js"></script>
  </body>
</html>
